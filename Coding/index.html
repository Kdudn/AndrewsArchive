<html>
	<head>
		<title>Andrew's Coding Archive</title>
		<link rel="icon" type="image/x-png" href="icon.png">
		<meta charset="utf-8">
		<style>
	        body {
	            font-family: "Libre Caslon Condensed", serif;
			  	font-weight: 400;
			  	font-style: normal;
	            text-align: center;
	        }
	        h1 {
	            font-size: 100px;
	            margin-top: 20px;
	            margin-bottom: -20px;
	        }
	        h2 {
	        	margin-bottom: 40px;
	        }
	        .folders-container {
	            display: flex;
	            flex-wrap: wrap;
	            justify-content: center;
	            gap: 40px;
	        }
	        .folder {
	            cursor: pointer;
	            transition: transform 0.2s;
	            display: inline-block;
	            text-align: center;
	            text-decoration: none;
	            color: black;
	        }
	        .folder img {
	        	height: 250px;
				width: 100%;
				object-fit: contain;
	        }
	        .folder-title {
	            font-size: 50px;
	            font-weight: bold;
	        }
	        button:active { transform: scale(0.97); }
            button, input {
                width: 90%;
                height: 80px;
                font-size: 24px;
                font-family: "Libre Caslon Condensed", serif;
			  	font-weight: 400;
			  	font-style: normal;
	            text-align: center;
                border-radius: 10px;
                border: none;
                margin: 10px;
               
	    </style>
	    <link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
	</head>
	<body>
		<h1>Andrew's Coding Archive</h1>
		<h2><a href="https://github.com/Kdudn/" target="_blank">Github (Kdudn)</a></h2>
		<div class="folders-container">
	        <a class="folder" href="https://github.com/Kdudn/Earth-the-Game" target="_blank">
	            <div class="folder-title">Earth the Game</div>
	            <img src="EarththeGame.png" alt="Earth the Game">
	        </a>
	        <a class="folder" href="https://github.com/Kdudn/Mountain-Generator" target="_blank">
	            <div class="folder-title">Mountain Generator</div>
	            <img src="MountainGenerator.png" alt="Mountain Generator">
	        </a>
	        <a class="folder" href="https://github.com/Kdudn/Tkinter-Lyrics" target="_blank">
	            <div class="folder-title">Tkinter Lyrics</div>
	            <img src="TkinterLyrics.png" alt="Tkinter Lyrics">
	        </a>
	        <a class="folder" href="https://github.com/Kdudn/Pupils-Path" target="_blank">
	            <div class="folder-title">Pupils Path</div>
	            <img src="PupilsPath.png" alt="Pupils Path">
	        </a>
	        <a class="folder" href="https://github.com/Kdudn/Avoid-The-Spikes-" target="_blank">
	            <div class="folder-title">Avoid the Spikes</div>
	            <img src="AvoidtheSpikes.png" alt="Avoid the Spikes">
	        </a>
	    </div>
	</body>
</html>

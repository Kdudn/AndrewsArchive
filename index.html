<html>
	<head>
		<title>Andrew's Archive</title>
		<link rel="icon" type="image/x-png" href="icon.png">
		<meta charset="utf-8">
		<style>
	        body {
	            font-family: "Libre Caslon Condensed", serif;
			  	font-weight: 400;
			  	font-style: normal;
	            text-align: center;
	        }
	        h1 {
	            font-size: 100px;
	            margin-top: 20px;
	        }
	        .folders-container {
	            display: flex;
	            flex-wrap: wrap;
	            justify-content: center;
	            gap: 40px;
	        }
	        .folder {
	            cursor: pointer;
	            transition: transform 0.2s;
	            display: inline-block;
	            text-align: center;
	            text-decoration: none;
	            color: black;
	        }
	        .folder-title {
	            font-size: 64px;
	            font-weight: bold;
	        }
	        button:active { transform: scale(0.97); }
            button, input {
                width: 90%;
                height: 80px;
                font-size: 24px;
                font-family: "Libre Caslon Condensed", serif;
			  	font-weight: 400;
			  	font-style: normal;
	            text-align: center;
                border-radius: 10px;
                border: none;
                margin: 10px;
               
	    </style>
	    <link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Condensed:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
	</head>
